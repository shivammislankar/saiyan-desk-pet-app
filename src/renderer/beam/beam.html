<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; script-src 'self'; style-src 'unsafe-inline'" />
  <title>Beam</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      pointer-events: none;
    }
    #wrap {
      width: 100%;
      height: 100%;
      opacity: 0;
    }
    img {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="wrap"><img id="beam" alt="" draggable="false" /></div>
  <script src="beam.js"></script>
</body>
</html>
